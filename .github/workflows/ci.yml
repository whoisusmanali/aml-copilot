name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -m "not integration" --cov=aml --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aml
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aml" --health-interval 5s --health-retries 20
    env:
      AML_POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12 && uv sync
      - name: Apply schema
        run: PGPASSWORD=ci-only psql -h localhost -U aml -d aml -f infra/postgres/init.sql
      - run: uv run aml-data prepare --source synthetic
      - run: uv run pytest -m integration

  evals:
    # Placeholder. From Step 7 this runs the golden-set evals and blocks merges on regressions.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - run: echo "Eval gates arrive in Step 7"
